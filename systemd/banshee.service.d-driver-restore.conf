# ~/.config/systemd/user/banshee.service.d/driver-restore.conf — CD, S444 (2026-10-08)
# If Banshee stops for ANY reason (launcher stop, crash, logout) while monitor mode had swapped in 88XXau,
# put CD's default Wi-Fi driver back. `normal` is a no-op when rtw_8812au is already bound.
[Service]
ExecStopPost=/usr/bin/sudo -n /usr/local/sbin/cd-wifi-driver normal
